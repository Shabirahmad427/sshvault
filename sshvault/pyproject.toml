[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "sshvault"
version = "0.3.3"
description = "Secure desktop SSH connection manager"
requires-python = ">=3.10"
dependencies = [
  "paramiko>=3.4,<4",
  "keyring>=24,<26",
  "pyte>=0.8,<1",
]

[project.optional-dependencies]
dev = ["build>=1,<2", "pytest>=8,<9", "ruff>=0.5,<1", "mypy>=1.10,<2", "types-paramiko>=3.4,<4"]

[project.scripts]
sshvault = "sshvault:main"

[tool.setuptools]
py-modules = ["sshvault", "sshvault_core", "sshvault_security"]

[tool.ruff]
line-length = 120
